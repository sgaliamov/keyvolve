# Keyboard effort table + pair costs used by scoring and layout fitness.
keyboard: data/keyboard.json
# Cached corpus stats JSON; required for evaluate/optimize.
stats: data/stats/merged.source-stats.json

merge:
  # Folder of raw .txt files to clean and merge into one corpus.
  input: data/samples
  # Output merged corpus file; overwritten if it exists.
  output: data/samples/merged.txt
  # Shuffle merged words before writing. false keeps source order.
  shuffle: false
  # Number of merged lines printed as preview.
  print: 50

frequencies:
  # Root folder to scan for matching files.
  input: 'C:/Users/Admin/'
  # File globs to count characters from.
  masks: ['*.js', '*.ts', '*.cs', '*.cpp', '*.h', '*.rs', '*.py']
  # CSV output for per-character frequencies.
  output: data/stats/frequencies.csv
  # Number of rows printed to stdout.
  print: 10

synthesise:
  # Source text file used to build the fake-word corpus.
  text: data/samples/merged.txt
  # Output fake-word corpus file.
  output: data/synthesised/sample-10000000.txt
  sample:
    # Total words to sample from the source corpus.
    target: 10000000

optimization:
  # Seed layout CSVs to load before GA starts; null means none.
  input: null
  # Layout CSV written after optimization.
  output: data/layouts.csv
  # Mutants produced per parent each generation.
  mutationCount: 10
  # Max home-row groups kept in final ranked output.
  maxGroups: 1
  # Number of layouts kept per home-row group in final ranked output.
  itemsPerGroup: 1
  # blocked: [0, 14, 19, 25]
  # frozen:
  #   h: 5
  # allowed:
  #   e: [6, 7, 8]
  # t: [1, 2, 3, 6, 7, 8]
  # a: [1, 2, 3, 6, 7, 8]
  # i: [1, 2, 3, 6, 7, 8]
  # o: [1, 2, 3, 6, 7, 8]
  #   n: [1, 2, 3, 6, 7, 8]
  #   r: [1, 2, 3, 6, 7, 8]
  #   s: [1, 2, 3, 6, 7, 8]
  #   h: [1, 2, 3, 5, 6, 7, 8, 12, 13]
  #   j: [5, 10, 11, 14]
  #   x: [5, 10, 11, 14]
  #   z: [10, 11, 14]
  #   q: [10, 11, 14]
  #
  # rolls: ['er', 'th']
  # left: [e, o]
  # right: [a, i]

rank:
  # Ranked keyboard JSON output from the calibration session.
  output: data/keyboard.json
  # Persisted session state for resuming the ranking run.
  session: data/rank-session.json
  # Chance of auditing a comparison during refinement.
  auditRate: 0.15
  # Minimum comparisons needed before stopping.
  minMatches: 10
  # Hard cap on comparisons per item.
  maxMatches: 30
  # Max allowed deviation before confidence is considered weak.
  maxDeviation: 98.5
  # Margin before the ranking path goes uphill.
  uphillGap: 50
  # Thin tail margin used when collapsing adjacent tiers.
  thinMargin: 1.0
  # Weight given to forced answers.
  forcedAnswerWeight: 2
  # Optional: ask this exact comparison first once (CLI override: --rank.forceCheckPair AF-VE)
  # forceCheckPair: AF-VE
  # Raise to merge more adjacent tail pairs into the same tier.
  # Fixed effort tier count; boundaries minimize within-tier rating variance.
  tierCount: 30
  # Shaping exponent for tier effort spacing (rating-anchored curve).
  #   1.0 = linear: effort gaps mirror rating gaps exactly (default).
  #   > 1 = easy tiers cluster near effortMin, hard tiers spread out
  #         (small penalty differences among good bigrams, harsh tail).
  #   < 1 = easy tiers spread out, hard tiers compress near effortMax
  #         (strong differentiation among good bigrams, flat tail).
  # Endpoints always pinned: best tier = effortMin, worst = effortMax.
  effortGamma: 0.8

evaluate:
  # One or more layout CSVs to score.
  input:
    - data/layouts.csv
    # - data/known-layouts.csv
    # - data/seed.csv
  # Output CSV for scored layouts.
  output: data/layouts.csv
  # output: data/layouts-all.csv
  # Number of best layouts printed to stdout.
  print: 10
  # Orientation used when saving layouts; left mirrors twin layouts.
  eSide: left

evaluator:
  # Fitness multiplier; higher scales scores up, lower scales down.
  fitnessScale: 1000000000000000

  # Curve steepness: term = weight · (|value| / max) ^ sharpness.
  # 1.0 = linear, higher = forgiving under the limit and brutal over it.
  sharpness: 4

  # Desired metric limits, in the percent units the CSV prints. Ideal is 0 for every metric.
  # `max` is the value that costs one full `weight`, also normalizes metrics against each other.
  # Bare number = max with weight 1; write `{ max: 1, weight: 2 }` when a metric should give way last.
  rowSwitchRatio: { max: 15, weight: 1 }
  handSwitchRatio: { max: 30, weight: 3 }
  effortsImbalance: { max: 5, weight: 1 }
  handsImbalance: { max: 5, weight: 1 }
  rollImbalance: { max: 5, weight: 1 }
  rowSwitchImbalance: { max: 5, weight: 1 }
  streakImbalance: { max: 5, weight: 1 }
  topRowRatio: { max: 25, weight: 1 }
  homeRowRatio: { max: 60, weight: 1 }
  bottomRowRatio: { max: 15, weight: 1 }
  # Home row left/right balance (absolute value); controls asymmetry in home row effort
  homeRowBalance: { max: 15, weight: 0.5 }
  # Left-hand column ratios (left c1=pinky through c5=index); right-hand mirrors left
  c1Ratio: { max: 8, weight: 0.75 }
  c2Ratio: { max: 11.5, weight: 0.75 }
  c3Ratio: { max: 13, weight: 0.75 }
  c4Ratio: { max: 10.5, weight: 0.75 }
  c5Ratio: { max: 7, weight: 0.75 }

ga:
  # Mutation probability applied per genome element.
  mutationRatio: 0.6
  # Individuals per pool.
  populationSize: 256
  # Generations without improvement before stopping.
  stagnationCount: 128
  # Number of island pools evolved in parallel.
  pools: 256
  # Randomly generated individuals ratio per generation.
  randomRatio: 0.25
  # Mutation steps applied to seeded layouts.
  seedMutation: 10
  # Binary dump file for GA state snapshots.
  dump: data/dump.bin
  # Probability of writing a dump snapshot.
  dumpRatio: 0.8
  # Keep or delete dump files after runs.
  keepDump: false

# Keyboard effort table + pair costs used by scoring and layout fitness.
keyboard: data/keyboard.json
# Cached corpus stats JSON; required for evaluate/optimize.
stats: data/stats/merged.source-stats.json

merge:
  # Folder of raw .txt files to clean and merge into one corpus.
  input: data/samples
  # Output merged corpus file; overwritten if it exists.
  output: data/samples/merged.txt
  # Optional: Stats directory for saving merged frequency data. Defaults to output/../stats.
  # stats: data/stats
  # Shuffle merged words before writing. false keeps source order.
  shuffle: false
  # Optional: Random seed for reproducible shuffling.
  # seed: 12345
  # Number of merged lines printed as preview.
  print: 50
  # Optional: Minimum bigram frequency kept in saved corpus stats. Default: 0.0001.
  # min_frequency: 0.0001

frequencies:
  # Root folder to scan for matching files.
  input: 'C:/Users/Admin/'
  # File globs to count characters from.
  masks: ['*.js', '*.ts', '*.cs', '*.cpp', '*.h', '*.rs', '*.py']
  # CSV output for per-character frequencies.
  output: data/stats/frequencies.csv
  # Number of rows printed to stdout.
  print: 10

synthesise:
  # Source text file used to build the fake-word corpus.
  text: data/samples/merged.txt
  # Output fake-word corpus file.
  output: data/synthesised/sample-10000000.txt
  # Optional: Stats directory for saving frequency data. Defaults to output/../stats.
  # stats: data/stats
  # Optional: Minimum accepted relative frequency. Pairs below this are dropped. Default: 0.0001.
  # min_frequency: 0.0001
  # Optional: Random seed for reproducible sampling.
  # seed: 42
  sample:
    # Total words to sample from the source corpus.
    target: 10000000

optimization:
  # Seed layout CSVs to load before GA starts; null means none.
  input: data/layouts.csv
  # Layout CSV written after optimization.
  output: data/layouts.csv
  # Mutants produced per parent each generation.
  mutationCount: 10
  # Max home-row groups kept in final ranked output.
  maxGroups: 3
  # Number of layouts kept per home-row group in final ranked output.
  itemsPerGroup: 10

  # Optional: Slot indices that must remain empty (blocked), unless a letter is frozen there.
  # blocked: [0, 28, 29]
  blocked: [29]

  # Optional: Characters pinned to specific slot indices; pins override allowed/left/right/blocked.
  # frozen:
  #   z: 10
  #   x: 11
  #   c: 12
  #   v: 13

  # Optional: Allowed slot indices for specific characters (white-list constraints).
  # Use only slots 0-14 here; each one also adds its mirrored right-hand position.
  # If specified, only these slots can be used, except for frozen pins.
  # Special key "_" constrains empty slots (the 4 unused positions).
  # These positions may be empty, not must be empty; blocked slots are also eligible.
  allowed:
    e: [6, 7, 8]
    '_': [0, 1, 10, 11]
    h: [1, 2, 3, 6, 7, 8, 9, 12, 13]

  # Optional: Character pairs that must stay on the same hand (left-left or right-right).
  # Disjoint pairs choose independently; overlapping pairs form one group. Contiguity is only preferred.
  # sameSide: ['er', 'th']

  # Optional: Characters restricted to the left hand (unless frozen elsewhere).
  # left: [x, c, v]

  # Optional: Characters restricted to the right hand (unless frozen elsewhere).
  # right: [a, i]

rank:
  # Ranked keyboard JSON output from the calibration session.
  output: data/keyboard.json
  # Persisted session state for resuming the ranking run.
  session: data/rank-session.json
  # Optional: CSV visual report path; defaults to output with .csv extension.
  # report: data/rank-report.csv
  # Probability of an audit question (consistency re-check of settled pairs). Default: 0.0.
  auditRate: 0.15
  # Minimum comparisons needed before stopping. Default: 10.
  minMatches: 10
  # Hard cap on comparisons per item. Default: 30.
  maxMatches: 30
  # Max allowed deviation before confidence is considered weak. Default: 170.0.
  maxDeviation: 98.5
  # Optional: Lower bound for fixed-tier efforts. Default: 1.0.
  # effortMin: 1.0
  # Optional: Upper bound for fixed-tier efforts. Default: 10.0.
  # effortMax: 10.0
  # Margin before the ranking path goes uphill. Default: 100.0.
  uphillGap: 50
  # Thin tail margin used when collapsing adjacent tiers. Default: 1.0.
  thinMargin: 1.0
  # Weight given to forced answers. Default: 3.
  forcedAnswerWeight: 2
  # Optional: Ask this exact comparison first once (format: AB-CD). Default: none.
  # forceCheckPair: AF-VE
  # Fixed effort tier count; boundaries minimize within-tier rating variance. Default: 10.
  tierCount: 30
  # Shaping exponent for tier effort spacing (rating-anchored curve). Default: 1.0.
  #   1.0 = linear: effort gaps mirror rating gaps exactly.
  #   > 1 = easy tiers cluster near effortMin, hard tiers spread out
  #         (small penalty differences among good bigrams, harsh tail).
  #   < 1 = easy tiers spread out, hard tiers compress near effortMax
  #         (strong differentiation among good bigrams, flat tail).
  # Endpoints always pinned: best tier = effortMin, worst = effortMax.
  effortGamma: 0.8
  # Optional: Random seed for reproducible question order.
  # seed: 42

evaluate:
  # One or more layout CSVs to score.
  input:
    - data/layouts.csv
    - data/layouts.known.csv
  # Output CSV for scored layouts.
  output: data/layouts.csv
  # output: data/layouts.known.csv
  # Number of best layouts printed to stdout.
  print: 5
  # Orientation used when saving layouts; left mirrors twin layouts.
  eSide: any

evaluator:
  # Fitness multiplier; higher scales scores up, lower scales down.
  fitnessScale: 100000000000000000

  # Curve steepness: term = weight · deviation ^ sharpness.
  # 1.0 = linear, higher = forgiving under the limit and brutal over it.
  sharpness: 4

  # Desired metric goals, in the percent units the CSV prints.
  # `max` rewards lower values; `target` rewards proximity to `value`.
  # Form: { type: max|target, value: <number>, weight: <number>, tolerance: <number> }
  #
  # tolerance (target type only, default 5): accepted miss in percentage points.
  # Cost = weight exactly `tolerance` points from `value`; inside ~free, outside walls
  # up with sharpness. Tighten to pin a metric, loosen to let effort win.
  # Example: { type: target, value: 10, tolerance: 2 }  # 4pp miss already costs 16x weight
  #
  # Tuning: read the "penalty breakdown" table logged for the best layout.
  # Effort metrics use effort shares/skews.
  # Press metrics use press counts, switches, and run lengths.
  # CSV fields used below:
  # - left/right effort/count/switch fields: left_effort, right_effort, left_count, right_count,
  #   hand_switches, left_row_switch_cost, right_row_switch_cost, left_rolls, right_rolls
  # - grouped effort fields: left_column_effort_ratio, right_column_effort_ratio,
  #   top_row_effort_ratio, home_row_effort_ratio, bottom_row_effort_ratio, row_balance
  # - grouped press fields: left_column_press_ratio, right_column_press_ratio, column_balance,
  #   left_finger_row_switch_ratio, right_finger_row_switch_ratio, finger_row_switch_balance
  # `share` says who pays now; `pressure` says who wins the next percentage point.
  # A metric stuck off goal with tiny pressure needs more weight or tighter tolerance;
  # two off-goal metrics with similar pressures are a physical conflict — relax one.

  # Effort metric: left/right effort asymmetry from CSV fields left_effort/right_effort.
  # type: max — lower is better.
  effortsImbalance: { type: max, value: 5, weight: 0.75 }

  # Press metric: left/right same-hand bigram count asymmetry from left_count/right_count.
  # type: max — lower is better.
  handsImbalance: { type: max, value: 5, weight: 0.5 }

  # Press metric: row-switch cost / same-hand bigram count from left_row_switch_cost/right_row_switch_cost
  # and left_count/right_count.
  # type: max — lower is better.
  # rowSwitchRatio: { type: max, value: 8, weight: 1 }

  # Press metric: hand-switches / same-hand bigram count from hand_switches and left_count/right_count.
  # type: max — lower is better.
  handSwitchRatio: { type: max, value: 38, weight: 2 }

  # Press metric: left/right roll count asymmetry from left_rolls/right_rolls.
  # type: max — lower is better.
  # rollImbalance: { type: max, value: 5, weight: 1 }

  # Press metric: left/right row-switch cost asymmetry from left_row_switch_cost/right_row_switch_cost.
  # type: max — lower is better.
  # rowSwitchImbalance: { type: max, value: 5, weight: 1 }

  # Press metric: left/right streak-length asymmetry from left_streak/right_streak.
  # type: max — lower is better.
  streakImbalance: { type: max, value: 10, weight: 0.1 }

  # Effort metric: home row left/right balance from row_balance (home entry).
  # type: max — lower is better (zero asymmetry is ideal).
  # homeRowBalance: { type: max, value: 10, weight: 0.5 }
  # Effort metric: top/home/bottom effort share targets from top_row_effort_ratio,
  # home_row_effort_ratio, bottom_row_effort_ratio.
  topRowRatio: { type: target, value: 24, weight: 1 }
  homeRowRatio: { type: target, value: 64, weight: 2 }
  bottomRowRatio: { type: target, value: 12, weight: 1 }

  # Effort metric: column caps from left/right_column_effort_ratio.
  # Each column's effort share cap in percentage. type: max — upper bound only, no pull-up.
  # Below the cap cost fades (deviation^sharpness); effort map decides placement, caps guard fatigue.
  pinkyRatio: { type: max, value: 6, weight: 1.0 }
  ringRatio: { type: max, value: 10, weight: 1.0 }
  middleRatio: { type: max, value: 13, weight: 1.0 }
  indexInnerRatio: { type: max, value: 12, weight: 1.0 }
  indexOuterRatio: { type: max, value: 9, weight: 1.0 }

  # Effort metric: per-finger left/right effort balance from column_balance.
  # type: max — lower is better (zero skew is ideal).
  pinkyBalance: { type: max, value: 10, weight: 0.25 }
  ringBalance: { type: max, value: 10, weight: 0.25 }
  middleBalance: { type: max, value: 10, weight: 0.25 }
  indexInnerBalance: { type: max, value: 10, weight: 0.25 }
  indexOuterBalance: { type: max, value: 10, weight: 0.25 }

  # Press metric: same-finger row-switch ratio caps from left/right_finger_row_switch_ratio.
  # Numerator = same-finger row-switch cost; denominator = that finger's presses.
  pinkyRowSwitchRatio: { type: max, value: 3, weight: 0.5 }
  ringRowSwitchRatio: { type: max, value: 5, weight: 0.5 }
  middleRowSwitchRatio: { type: max, value: 8, weight: 0.5 }
  indexRowSwitchRatio: { type: max, value: 8, weight: 0.5 }

  # Press metric: same-finger row-switch left/right balance from finger_row_switch_balance.
  pinkyRowSwitchBalance: { type: max, value: 5, weight: 0.1 }
  ringRowSwitchBalance: { type: max, value: 5, weight: 0.1 }
  middleRowSwitchBalance: { type: max, value: 5, weight: 0.1 }
  indexRowSwitchBalance: { type: max, value: 5, weight: 0.1 }

ga:
  # Mutation probability applied per genome element.
  mutationRatio: 0.6
  # Individuals per pool.
  populationSize: 256
  # Generations without improvement before stopping.
  stagnationCount: 128
  # Number of island pools evolved in parallel.
  pools: 128
  # Randomly generated individuals ratio per generation.
  randomRatio: 0.25
  # Mutation steps applied to seeded layouts.
  seedMutation: 10
  # Binary dump file for GA state snapshots.
  dump: data/dump.bin
  # Probability of writing a dump snapshot.
  dumpRatio: 0.8
  # Keep or delete dump files after runs.
  keepDump: false

# ============================================================================
# MODE: Operation mode for this run
# ============================================================================
# Uncomment one of the following to set the active mode; default is Evaluate.
# mode: Optimize    # Run the genetic algorithm to optimize the keyboard layout
# mode: Evaluate    # Evaluate the score of specific layouts (default)
# mode: Synthesise  # Build digraph frequency CSV and synthesise a fake-word corpus
# mode: Merge       # Merge all .txt files in a folder into one cleaned file
# mode: Frequencies # Count per-key char frequencies across files in a folder
# mode: Rank        # Interactively rank bigram pairs to calibrate keyboard efforts
